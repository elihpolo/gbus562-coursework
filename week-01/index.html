<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMW Tic-Tac-Toe</title>
<style>
  /* ===== Colors (UMW-inspired navy, gray, and white) ===== */
  :root {
    --navy-dark: #061630;
    --navy: #0b2a55;
    --navy-light: #1d4580;
    --gray-dark: #5c6675;
    --gray: #a9b3c1;
    --gray-light: #dde2ea;
    --white: #ffffff;
    --screen: #03101f;
    --glow: 0 0 3px rgba(255, 255, 255, 0.35);
    --arcade-font: "Consolas", "Lucida Console", "Courier New", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--gray-light);
    font-family: var(--arcade-font);
    color: var(--white);
  }

  /* ===== The arcade cabinet ===== */
  .cabinet {
    width: 100%;
    max-width: 420px;
    background: var(--navy);
    border: 6px solid var(--gray);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(6, 22, 48, 0.2);
    overflow: hidden;
  }

  /* Marquee: the lit-up sign at the top */
  .marquee {
    background: var(--navy-dark);
    border-bottom: 4px solid var(--gray);
    padding: 16px 12px;
    text-align: center;
  }
  .marquee h1 {
    margin: 0;
    font-size: clamp(1.2rem, 6vw, 1.6rem);
    letter-spacing: 0.12em;
    text-shadow: var(--glow);
  }
  .marquee h1 .star {
    color: var(--gray);
  }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    justify-content: space-around;
    padding: 14px 12px 4px;
    font-weight: bold;
    letter-spacing: 0.08em;
  }
  .score-label {
    color: var(--gray);
  }
  .score-value {
    text-shadow: var(--glow);
  }

  /* Screen: the dark area that holds the game */
  .screen {
    position: relative;
    margin: 12px 16px 18px;
    padding: 16px;
    background: var(--screen);
    border: 4px solid var(--navy-dark);
    border-radius: 14px;
    box-shadow: inset 0 0 12px rgba(29, 69, 128, 0.35);
  }
  /* Faint horizontal lines like an old arcade monitor */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.04) 0px,
      rgba(255, 255, 255, 0.04) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }
  .screen.tie-flicker {
    animation: flicker 0.6s steps(2) 2;
  }

  #status {
    text-align: center;
    font-weight: bold;
    font-size: 1.15rem;
    letter-spacing: 0.1em;
    min-height: 1.5em;
    margin-bottom: 14px;
    text-shadow: var(--glow);
  }

  /* The 3x3 board */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--navy-dark);
    border: 2px solid var(--navy-light);
    border-radius: 8px;
    font-family: var(--arcade-font);
    font-size: clamp(2.2rem, 12vw, 3.4rem);
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .cell:hover:empty {
    background: var(--navy);
    border-color: var(--gray);
  }
  .cell:focus-visible {
    outline: 3px solid var(--white);
    outline-offset: 2px;
  }
  /* X and O are drawn as shapes (SVG) so they fill the square */
  .cell.x,
  .cell.o {
    padding: 10%;
    animation: pop 0.2s ease-out;
  }
  .mark {
    display: block;
    width: 100%;
    height: 100%;
    fill: none;
    stroke-width: 16;
    stroke-linecap: round;
  }
  .cell.x .mark {
    stroke: var(--white);
    filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.35));
  }
  .cell.o .mark {
    stroke: var(--gray-light);
    filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.35));
  }
  .cell.win {
    background: var(--navy-light);
    border-color: var(--white);
    animation: flash 0.5s steps(2) 4;
  }

  /* ===== Control panel (bottom of the cabinet) ===== */
  .controls {
    background: var(--gray-dark);
    border-top: 4px solid var(--gray);
    padding: 16px 12px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .button-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .arcade-btn {
    font-family: var(--arcade-font);
    font-weight: bold;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    padding: 9px 14px;
    color: var(--white);
    background: var(--navy);
    border: 2px solid var(--gray);
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--navy-dark);
    cursor: pointer;
  }
  .arcade-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--navy-dark);
  }
  /* The selected mode or difficulty is lit up in white */
  .arcade-btn.selected {
    background: var(--white);
    color: var(--navy);
    border-color: var(--white);
  }
  .arcade-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .arcade-btn:focus-visible {
    outline: 3px solid var(--white);
    outline-offset: 2px;
  }

  #restart {
    width: 120px;
    height: 56px;
    font-size: 1rem;
    background: var(--white);
    color: var(--navy);
    border: 3px solid var(--gray);
    box-shadow: 0 5px 0 var(--navy-dark);
  }

  /* ===== Animations ===== */
  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes flash {
    50% { background: var(--navy-dark); }
  }
  @keyframes flicker {
    50% { opacity: 0.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cell, .screen { animation: none !important; }
  }
</style>
</head>
<body>

<div class="cabinet">

  <div class="marquee">
    <h1><span class="star">&#9733;</span> UMW TIC-TAC-TOE <span class="star">&#9733;</span></h1>
  </div>

  <div class="scoreboard">
    <div><span class="score-label">X:</span> <span class="score-value" id="scoreX">00</span></div>
    <div><span class="score-label">TIES:</span> <span class="score-value" id="scoreTie">00</span></div>
    <div><span class="score-label">O:</span> <span class="score-value" id="scoreO">00</span></div>
  </div>

  <div class="screen" id="screen">
    <div id="status" aria-live="polite"></div>

    <!-- The 9 squares. data-index tells JavaScript which square was clicked (0-8). -->
    <div class="board">
      <button class="cell" data-index="0" aria-label="Square 1"></button>
      <button class="cell" data-index="1" aria-label="Square 2"></button>
      <button class="cell" data-index="2" aria-label="Square 3"></button>
      <button class="cell" data-index="3" aria-label="Square 4"></button>
      <button class="cell" data-index="4" aria-label="Square 5"></button>
      <button class="cell" data-index="5" aria-label="Square 6"></button>
      <button class="cell" data-index="6" aria-label="Square 7"></button>
      <button class="cell" data-index="7" aria-label="Square 8"></button>
      <button class="cell" data-index="8" aria-label="Square 9"></button>
    </div>
  </div>

  <div class="controls">
    <div class="button-row">
      <button class="arcade-btn mode-btn selected" data-mode="computer">1P VS CPU</button>
      <button class="arcade-btn mode-btn" data-mode="pvp">2 PLAYER</button>
    </div>
    <div class="button-row">
      <button class="arcade-btn level-btn" data-level="easy">EASY</button>
      <button class="arcade-btn level-btn selected" data-level="medium">MED</button>
      <button class="arcade-btn level-btn" data-level="hard">HARD</button>
    </div>
    <button class="arcade-btn" id="restart">RESTART</button>
  </div>

</div>

<script>
  // ===== Game data =====

  // Every way to get three in a row. Squares are numbered 0-8:
  //   0 | 1 | 2
  //   3 | 4 | 5
  //   6 | 7 | 8
  const WINNING_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
    [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
    [0, 4, 8], [2, 4, 6]             // diagonals
  ];

  // The X and O shapes, drawn with SVG lines and circles on a 100x100 grid.
  const SHAPES = {
    X: '<svg class="mark" viewBox="0 0 100 100"><line x1="15" y1="15" x2="85" y2="85"/><line x1="85" y1="15" x2="15" y2="85"/></svg>',
    O: '<svg class="mark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="36"/></svg>'
  };

  // In 1P vs CPU mode, you are X and the computer is O.
  const HUMAN = "X";
  const COMPUTER = "O";

  let board = [];            // 9 slots, each "X", "O", or "" (empty)
  let currentPlayer = "X";   // whose turn it is; X always goes first
  let gameOver = false;
  let mode = "computer";     // "computer" or "pvp"
  let difficulty = "medium"; // "easy", "medium", or "hard"
  let scores = { X: 0, O: 0, tie: 0 };

  // ===== Page elements =====
  const cells = document.querySelectorAll(".cell");
  const statusText = document.getElementById("status");
  const screen = document.getElementById("screen");
  const modeButtons = document.querySelectorAll(".mode-btn");
  const levelButtons = document.querySelectorAll(".level-btn");

  // ===== Starting and restarting =====

  // Clears the board and starts a new game. Scores are kept.
  function startNewGame() {
    board = ["", "", "", "", "", "", "", "", ""];
    currentPlayer = "X";
    gameOver = false;

    cells.forEach(function (cell, index) {
      cell.innerHTML = "";
      cell.classList.remove("x", "o", "win");
      cell.setAttribute("aria-label", "Square " + (index + 1));
    });
    screen.classList.remove("tie-flicker");

    updateStatus();
  }

  // Sets all scores back to zero.
  function resetScores() {
    scores = { X: 0, O: 0, tie: 0 };
    updateScoreboard();
  }

  // ===== Playing a turn =====

  // Runs when a square is clicked.
  function handleCellClick(index) {
    // Ignore the click if the game is over or the square is taken.
    if (gameOver || board[index] !== "") {
      return;
    }

    makeMove(index);

    // In 1P vs CPU mode, the computer answers right after your move.
    if (mode === "computer" && !gameOver) {
      makeMove(chooseComputerMove());
    }
  }

  // Places the current player's mark, then checks for a win or tie.
  // If the game isn't over, it switches to the other player.
  function makeMove(index) {
    board[index] = currentPlayer;
    cells[index].innerHTML = SHAPES[currentPlayer];
    cells[index].classList.add(currentPlayer.toLowerCase());
    cells[index].setAttribute("aria-label", "Square " + (index + 1) + ", " + currentPlayer);

    const winningLine = findWinningLine(board);

    if (winningLine) {
      endGame(currentPlayer, winningLine);
    } else if (isBoardFull(board)) {
      endGame("tie", null);
    } else {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus();
    }
  }

  // Ends the game, adds a point to the scoreboard, and shows the result.
  // result is "X", "O", or "tie". line is the winning squares (or null for a tie).
  function endGame(result, line) {
    gameOver = true;
    scores[result] = scores[result] + 1;
    updateScoreboard();

    if (result === "tie") {
      statusText.textContent = "TIE GAME!";
      screen.classList.add("tie-flicker");
      return;
    }

    // Highlight the three winning squares.
    line.forEach(function (index) {
      cells[index].classList.add("win");
    });
    statusText.textContent = result + " WINS!";
  }

  // ===== Checking the board =====

  // Returns the winning line (like [0, 4, 8]) if someone has three in a row,
  // or null if nobody has won yet.
  function findWinningLine(b) {
    for (const line of WINNING_LINES) {
      const [a, c, d] = line;
      if (b[a] !== "" && b[a] === b[c] && b[a] === b[d]) {
        return line;
      }
    }
    return null;
  }

  // Returns true when all 9 squares are filled.
  function isBoardFull(b) {
    return b.every(function (square) { return square !== ""; });
  }

  // Returns a list of the empty square numbers, like [1, 5, 7].
  function getEmptySquares(b) {
    const empty = [];
    for (let i = 0; i < 9; i++) {
      if (b[i] === "") {
        empty.push(i);
      }
    }
    return empty;
  }

  // ===== Computer player =====

  // Picks the computer's move based on the chosen difficulty.
  function chooseComputerMove() {
    if (difficulty === "easy") return easyMove();
    if (difficulty === "medium") return mediumMove();
    return hardMove();
  }

  // Easy: pick any empty square at random.
  function easyMove() {
    const empty = getEmptySquares(board);
    return empty[Math.floor(Math.random() * empty.length)];
  }

  // Medium: win if possible, block the player if needed, otherwise pick randomly.
  function mediumMove() {
    const winMove = findMoveThatWins(COMPUTER);
    if (winMove !== null) return winMove;

    const blockMove = findMoveThatWins(HUMAN);
    if (blockMove !== null) return blockMove;

    return easyMove();
  }

  // Returns a square that would give `player` three in a row, or null if none.
  // It works by trying each empty square, checking for a win, then undoing it.
  function findMoveThatWins(player) {
    for (const index of getEmptySquares(board)) {
      board[index] = player;
      const wins = findWinningLine(board) !== null;
      board[index] = "";
      if (wins) return index;
    }
    return null;
  }

  // Hard: use minimax to pick the best possible move. It can't be beaten.
  function hardMove() {
    let bestScore = -Infinity;
    let bestMove = null;

    for (const index of getEmptySquares(board)) {
      board[index] = COMPUTER;
      const score = minimax(board, false);
      board[index] = "";

      if (score > bestScore) {
        bestScore = score;
        bestMove = index;
      }
    }
    return bestMove;
  }

  // Minimax plays out every possible rest of the game and scores it:
  //   +1 = computer wins, -1 = player wins, 0 = tie.
  // On the computer's turn it picks the highest score (best for the computer).
  // On the player's turn it assumes the player picks the lowest score (best for them).
  function minimax(b, isComputerTurn) {
    const line = findWinningLine(b);
    if (line) {
      return b[line[0]] === COMPUTER ? 1 : -1;
    }
    if (isBoardFull(b)) {
      return 0;
    }

    const scoresFound = [];
    for (const index of getEmptySquares(b)) {
      b[index] = isComputerTurn ? COMPUTER : HUMAN;
      scoresFound.push(minimax(b, !isComputerTurn));
      b[index] = "";
    }

    return isComputerTurn ? Math.max(...scoresFound) : Math.min(...scoresFound);
  }

  // ===== Updating the screen =====

  // Shows whose turn it is.
  function updateStatus() {
    statusText.textContent = currentPlayer + "'S TURN";
  }

  // Copies the scores onto the scoreboard as two digits, like "03".
  function updateScoreboard() {
    document.getElementById("scoreX").textContent = String(scores.X).padStart(2, "0");
    document.getElementById("scoreO").textContent = String(scores.O).padStart(2, "0");
    document.getElementById("scoreTie").textContent = String(scores.tie).padStart(2, "0");
  }

  // Lights up the chosen button in a group and turns the others off.
  function selectButton(buttons, chosen) {
    buttons.forEach(function (button) {
      button.classList.toggle("selected", button === chosen);
    });
  }

  // ===== Connecting buttons to functions =====

  cells.forEach(function (cell) {
    cell.addEventListener("click", function () {
      handleCellClick(Number(cell.dataset.index));
    });
  });

  document.getElementById("restart").addEventListener("click", startNewGame);

  // Changing the mode starts a fresh game with fresh scores.
  modeButtons.forEach(function (button) {
    button.addEventListener("click", function () {
      if (button.dataset.mode === mode) return;
      mode = button.dataset.mode;
      selectButton(modeButtons, button);

      // The difficulty buttons only matter when playing the computer.
      levelButtons.forEach(function (levelButton) {
        levelButton.disabled = mode === "pvp";
      });

      resetScores();
      startNewGame();
    });
  });

  // Changing the difficulty also starts a fresh game with fresh scores.
  levelButtons.forEach(function (button) {
    button.addEventListener("click", function () {
      if (button.dataset.level === difficulty) return;
      difficulty = button.dataset.level;
      selectButton(levelButtons, button);
      resetScores();
      startNewGame();
    });
  });

  // Set up the first game when the page loads.
  resetScores();
  startNewGame();
</script>
</body>
</html>
