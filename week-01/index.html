<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #f4f4f4;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }

  h1 {
    margin: 0 0 16px;
  }

  /* Mode and difficulty dropdowns */
  .settings {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
  }
  select {
    font-size: 1rem;
    padding: 4px 8px;
  }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 1.05rem;
  }
  .scoreboard strong {
    font-size: 1.3rem;
  }

  #status {
    font-size: 1.2rem;
    font-weight: bold;
    min-height: 1.5em;
    margin-bottom: 12px;
  }

  /* The 3x3 board */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 330px;
    margin: 0 auto 20px;
  }
  .cell {
    aspect-ratio: 1;
    font-size: 3rem;
    font-weight: bold;
    background: #fff;
    border: 2px solid #333;
    border-radius: 6px;
    cursor: pointer;
  }
  .cell:hover {
    background: #eaeaea;
  }
  .cell.x {
    color: #d32f2f;
  }
  .cell.o {
    color: #1565c0;
  }
  .cell.win {
    background: #fff3a0;
  }

  #restart {
    font-size: 1rem;
    padding: 10px 24px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #restart:hover {
    background: #555;
  }
</style>
</head>
<body>

<h1>Tic-Tac-Toe</h1>

<div class="settings">
  <label>
    Mode:
    <select id="mode">
      <option value="computer">Player vs. Computer</option>
      <option value="pvp">Player vs. Player</option>
    </select>
  </label>
  <label id="difficultyLabel">
    Difficulty:
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label>
</div>

<div class="scoreboard">
  <div><span id="nameX">You (X)</span>: <strong id="scoreX">0</strong></div>
  <div>Ties: <strong id="scoreTie">0</strong></div>
  <div><span id="nameO">Computer (O)</span>: <strong id="scoreO">0</strong></div>
</div>

<div id="status"></div>

<!-- The 9 squares. data-index tells JavaScript which square was clicked (0-8). -->
<div class="board">
  <button class="cell" data-index="0"></button>
  <button class="cell" data-index="1"></button>
  <button class="cell" data-index="2"></button>
  <button class="cell" data-index="3"></button>
  <button class="cell" data-index="4"></button>
  <button class="cell" data-index="5"></button>
  <button class="cell" data-index="6"></button>
  <button class="cell" data-index="7"></button>
  <button class="cell" data-index="8"></button>
</div>

<button id="restart">Restart Game</button>

<script>
  // ===== Game data =====

  // Every way to get three in a row. Squares are numbered 0-8:
  //   0 | 1 | 2
  //   3 | 4 | 5
  //   6 | 7 | 8
  const WINNING_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
    [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
    [0, 4, 8], [2, 4, 6]             // diagonals
  ];

  let board = [];            // 9 slots, each "X", "O", or "" (empty)
  let currentPlayer = "X";   // whose turn it is; X always goes first
  let gameOver = false;
  let scores = { X: 0, O: 0, tie: 0 };

  // In Player vs. Computer mode, you are X and the computer is O.
  const HUMAN = "X";
  const COMPUTER = "O";

  // ===== Page elements =====
  const cells = document.querySelectorAll(".cell");
  const statusText = document.getElementById("status");
  const modeSelect = document.getElementById("mode");
  const difficultySelect = document.getElementById("difficulty");
  const difficultyLabel = document.getElementById("difficultyLabel");

  // ===== Starting and restarting =====

  // Clears the board and starts a new game. Scores are kept.
  function startNewGame() {
    board = ["", "", "", "", "", "", "", "", ""];
    currentPlayer = "X";
    gameOver = false;

    cells.forEach(function (cell) {
      cell.textContent = "";
      cell.classList.remove("x", "o", "win");
    });

    updateStatus();
  }

  // Sets all scores back to zero and updates the names on the scoreboard.
  function resetScores() {
    scores = { X: 0, O: 0, tie: 0 };
    if (isComputerMode()) {
      document.getElementById("nameX").textContent = "You (X)";
      document.getElementById("nameO").textContent = "Computer (O)";
    } else {
      document.getElementById("nameX").textContent = "Player X";
      document.getElementById("nameO").textContent = "Player O";
    }
    updateScoreboard();
  }

  // ===== Playing a turn =====

  // Runs when a square is clicked.
  function handleCellClick(index) {
    // Ignore the click if the game is over or the square is taken.
    if (gameOver || board[index] !== "") {
      return;
    }

    makeMove(index);

    // In computer mode, the computer answers right after your move.
    if (isComputerMode() && !gameOver) {
      makeMove(chooseComputerMove());
    }
  }

  // Places the current player's mark, then checks for a win or tie.
  // If the game isn't over, it switches to the other player.
  function makeMove(index) {
    board[index] = currentPlayer;
    cells[index].textContent = currentPlayer;
    cells[index].classList.add(currentPlayer.toLowerCase());

    const winningLine = findWinningLine(board);

    if (winningLine) {
      endGame(currentPlayer, winningLine);
    } else if (isBoardFull(board)) {
      endGame("tie", null);
    } else {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus();
    }
  }

  // Ends the game, adds a point to the scoreboard, and shows the result.
  // result is "X", "O", or "tie". line is the winning squares (or null for a tie).
  function endGame(result, line) {
    gameOver = true;
    scores[result] = scores[result] + 1;
    updateScoreboard();

    if (result === "tie") {
      statusText.textContent = "It's a tie!";
      return;
    }

    // Highlight the three winning squares.
    line.forEach(function (index) {
      cells[index].classList.add("win");
    });

    if (isComputerMode()) {
      statusText.textContent = result === HUMAN ? "You win!" : "The computer wins!";
    } else {
      statusText.textContent = "Player " + result + " wins!";
    }
  }

  // ===== Checking the board =====

  // Returns the winning line (like [0, 4, 8]) if someone has three in a row,
  // or null if nobody has won yet.
  function findWinningLine(b) {
    for (const line of WINNING_LINES) {
      const [a, c, d] = line;
      if (b[a] !== "" && b[a] === b[c] && b[a] === b[d]) {
        return line;
      }
    }
    return null;
  }

  // Returns true when all 9 squares are filled.
  function isBoardFull(b) {
    return b.every(function (square) { return square !== ""; });
  }

  // Returns a list of the empty square numbers, like [1, 5, 7].
  function getEmptySquares(b) {
    const empty = [];
    for (let i = 0; i < 9; i++) {
      if (b[i] === "") {
        empty.push(i);
      }
    }
    return empty;
  }

  // ===== Computer player =====

  // Picks the computer's move based on the chosen difficulty.
  function chooseComputerMove() {
    const level = difficultySelect.value;
    if (level === "easy") return easyMove();
    if (level === "medium") return mediumMove();
    return hardMove();
  }

  // Easy: pick any empty square at random.
  function easyMove() {
    const empty = getEmptySquares(board);
    return empty[Math.floor(Math.random() * empty.length)];
  }

  // Medium: win if possible, block the player if needed,
  // otherwise take the center, otherwise pick randomly.
  function mediumMove() {
    const winMove = findMoveThatWins(COMPUTER);
    if (winMove !== null) return winMove;

    const blockMove = findMoveThatWins(HUMAN);
    if (blockMove !== null) return blockMove;

    if (board[4] === "") return 4;

    return easyMove();
  }

  // Returns a square that would give `player` three in a row, or null if none.
  // It works by trying each empty square, checking for a win, then undoing it.
  function findMoveThatWins(player) {
    for (const index of getEmptySquares(board)) {
      board[index] = player;
      const wins = findWinningLine(board) !== null;
      board[index] = "";
      if (wins) return index;
    }
    return null;
  }

  // Hard: use minimax to pick the best possible move. It can't be beaten.
  function hardMove() {
    let bestScore = -Infinity;
    let bestMove = null;

    for (const index of getEmptySquares(board)) {
      board[index] = COMPUTER;
      const score = minimax(board, false);
      board[index] = "";

      if (score > bestScore) {
        bestScore = score;
        bestMove = index;
      }
    }
    return bestMove;
  }

  // Minimax plays out every possible rest of the game and scores it:
  //   +1 = computer wins, -1 = player wins, 0 = tie.
  // On the computer's turn it picks the highest score (best for the computer).
  // On the player's turn it assumes the player picks the lowest score (best for them).
  function minimax(b, isComputerTurn) {
    const line = findWinningLine(b);
    if (line) {
      return b[line[0]] === COMPUTER ? 1 : -1;
    }
    if (isBoardFull(b)) {
      return 0;
    }

    const scoresFound = [];
    for (const index of getEmptySquares(b)) {
      b[index] = isComputerTurn ? COMPUTER : HUMAN;
      scoresFound.push(minimax(b, !isComputerTurn));
      b[index] = "";
    }

    return isComputerTurn ? Math.max(...scoresFound) : Math.min(...scoresFound);
  }

  // ===== Updating the screen =====

  function isComputerMode() {
    return modeSelect.value === "computer";
  }

  // Shows whose turn it is.
  function updateStatus() {
    if (isComputerMode()) {
      statusText.textContent = "Your turn (X)";
    } else {
      statusText.textContent = "Player " + currentPlayer + "'s turn";
    }
  }

  // Copies the scores onto the page.
  function updateScoreboard() {
    document.getElementById("scoreX").textContent = scores.X;
    document.getElementById("scoreO").textContent = scores.O;
    document.getElementById("scoreTie").textContent = scores.tie;
  }

  // ===== Connecting buttons to functions =====

  cells.forEach(function (cell) {
    cell.addEventListener("click", function () {
      handleCellClick(Number(cell.dataset.index));
    });
  });

  document.getElementById("restart").addEventListener("click", startNewGame);

  // Changing the mode or difficulty starts a fresh game with fresh scores.
  modeSelect.addEventListener("change", function () {
    // The difficulty setting only matters when playing the computer.
    difficultyLabel.style.display = isComputerMode() ? "" : "none";
    resetScores();
    startNewGame();
  });

  difficultySelect.addEventListener("change", function () {
    resetScores();
    startNewGame();
  });

  // Set up the first game when the page loads.
  resetScores();
  startNewGame();
</script>
</body>
</html>
